<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="300" viewBox="0 0 1050 300" role="img" aria-labelledby="title desc">
<title id="title">OpenVisio V43.25 — spatial filtering for static VSDX routes</title>
<desc id="desc">A route envelope queries a padded rectangle index; intersecting equipment remains checked and distant equipment is skipped.</desc>
<rect width="1050" height="300" rx="16" fill="#f7f9fc"/>
<text x="28" y="38" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#172b4d">V43.25 — Préfiltrage spatial des routes VSDX</text>
<rect x="30" y="74" width="210" height="78" rx="10" fill="#e8f1fb" stroke="#375a7f" stroke-width="2"/>
<text x="135" y="105" text-anchor="middle" font-family="Segoe UI,Arial" font-size="16" font-weight="700" fill="#18324b">Enveloppe de route</text>
<text x="135" y="128" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12" fill="#18324b">waypoints statiques</text>
<path d="M240 113 H300 M292 106 L302 113 L292 120" stroke="#375a7f" stroke-width="3" fill="none"/>
<rect x="310" y="74" width="220" height="78" rx="10" fill="#edf4fb" stroke="#375a7f" stroke-width="2"/>
<text x="420" y="105" text-anchor="middle" font-family="Segoe UI,Arial" font-size="16" font-weight="700" fill="#18324b">Index spatial</text>
<text x="420" y="128" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12" fill="#18324b">bornes rembourrées</text>
<path d="M530 113 H590 M582 106 L592 113 L582 120" stroke="#375a7f" stroke-width="3" fill="none"/>
<rect x="600" y="62" width="205" height="100" rx="10" fill="#e8f7ef" stroke="#23845b" stroke-width="2"/>
<text x="702" y="92" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" font-weight="700" fill="#155d42">Candidats locaux</text>
<text x="702" y="115" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12" fill="#155d42">vérification exacte</text>
<text x="702" y="136" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12" fill="#155d42">extrémités + obstacles</text>
<path d="M805 113 H855 M847 106 L857 113 L847 120" stroke="#375a7f" stroke-width="3" fill="none"/>
<rect x="865" y="74" width="155" height="78" rx="10" fill="#fff1dd" stroke="#ba6f12" stroke-width="2"/>
<text x="942" y="105" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" font-weight="700" fill="#74430b">Routeur sûr</text>
<text x="942" y="128" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12" fill="#74430b">repli si rejet</text>
<path d="M400 172 V214 H700 V172" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" fill="none"/>
<text x="550" y="238" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" fill="#475569">Données malformées : balayage complet conservé</text>
<text x="30" y="278" font-family="Segoe UI,Arial" font-size="12" fill="#64748b">Schéma technique — pas une capture de l'application ni une certification Microsoft Visio.</text>
</svg>
