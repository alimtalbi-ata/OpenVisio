<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc">
  <title id="title">OpenVisio V43.21 package validation pipeline</title>
  <desc id="desc">An untrusted VSDX ZIP passes through canonical raw path checks, integrity checks, validated model loading, and the OpenVisio editor/export layer.</desc>
  <rect width="1100" height="300" fill="#f8fafc"/>
  <text x="40" y="44" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#18324b">OpenVisio V43.21 - canonical package paths</text>
  <text x="40" y="72" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#475569">Untrusted ZIP/VSDX members are validated before JSON or XML content is consumed.</text>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <rect x="40" y="118" width="210" height="100" rx="12" fill="#eaf2fb" stroke="#315d83" stroke-width="2"/>
    <text x="145" y="156" font-size="17" font-weight="700" fill="#18324b">VSDX / ZIP</text>
    <text x="145" y="182" font-size="13" fill="#334155">Raw member names</text>
    <path d="M250 168 H292 M281 158 L292 168 L281 178" fill="none" stroke="#315d83" stroke-width="3"/>
    <rect x="296" y="118" width="230" height="100" rx="12" fill="#fff7e6" stroke="#b7791f" stroke-width="2"/>
    <text x="411" y="151" font-size="17" font-weight="700" fill="#744210">Canonical path guard</text>
    <text x="411" y="176" font-size="13" fill="#744210">No traversal / aliases</text>
    <text x="411" y="196" font-size="13" fill="#744210">Unique case-folded parts</text>
    <path d="M526 168 H568 M557 158 L568 168 L557 178" fill="none" stroke="#315d83" stroke-width="3"/>
    <rect x="572" y="118" width="210" height="100" rx="12" fill="#e8f6ef" stroke="#28734b" stroke-width="2"/>
    <text x="677" y="156" font-size="17" font-weight="700" fill="#14532d">Validated model</text>
    <text x="677" y="182" font-size="13" fill="#14532d">Stable IDs + schema</text>
    <path d="M782 168 H824 M813 158 L824 168 L813 178" fill="none" stroke="#315d83" stroke-width="3"/>
    <rect x="828" y="118" width="230" height="100" rx="12" fill="#f0ecfb" stroke="#6b4ba1" stroke-width="2"/>
    <text x="943" y="151" font-size="17" font-weight="700" fill="#44246e">OpenVisio</text>
    <text x="943" y="176" font-size="13" fill="#44246e">Editor / SVG / VSDX</text>
    <text x="943" y="196" font-size="13" fill="#44246e">Same mirrored engine</text>
  </g>
  <text x="40" y="258" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#475569">QA boundary: synthetic/unit tests and Windows build smoke are not Microsoft Visio Desktop certification.</text>
  <text x="40" y="281" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">Author: Abdelhalim Talbi | Main branch unchanged | No automatic merge</text>
</svg>
