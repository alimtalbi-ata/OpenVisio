<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360"><rect width="1100" height="360" fill="#f8fafc"/><text x="32" y="38" font-family="Arial" font-size="22" fill="#0f172a">OpenVisio V43.22 — static VSDX route safety</text><rect x="35" y="90" width="180" height="82" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="125" y="124" text-anchor="middle" font-family="Arial" font-size="16" fill="#1e3a8a">External VSDX</text><text x="125" y="147" text-anchor="middle" font-family="Arial" font-size="13" fill="#1e3a8a">static numeric bends</text><path d="M215 131 H270" stroke="#475569" stroke-width="2.5" fill="none"/><path d="M262 123 L270 131 L262 139" stroke="#475569" stroke-width="2.5" fill="none"/><rect x="275" y="90" width="210" height="82" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="380" y="122" text-anchor="middle" font-family="Arial" font-size="16" fill="#14532d">Strict validation</text><text x="380" y="146" text-anchor="middle" font-family="Arial" font-size="13" fill="#14532d">schema, bounds, H/V</text><path d="M485 131 H540" stroke="#475569" stroke-width="2.5" fill="none"/><path d="M532 123 L540 131 L532 139" stroke="#475569" stroke-width="2.5" fill="none"/><rect x="545" y="90" width="230" height="82" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="660" y="122" text-anchor="middle" font-family="Arial" font-size="16" fill="#92400e">Route fingerprint</text><text x="660" y="146" text-anchor="middle" font-family="Arial" font-size="13" fill="#92400e">source + target geometry</text><path d="M775 131 H830" stroke="#475569" stroke-width="2.5" fill="none"/><path d="M822 123 L830 131 L822 139" stroke="#475569" stroke-width="2.5" fill="none"/><rect x="835" y="90" width="230" height="82" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="950" y="122" text-anchor="middle" font-family="Arial" font-size="16" fill="#4c1d95">Routing decision</text><text x="950" y="146" text-anchor="middle" font-family="Arial" font-size="13" fill="#4c1d95">preserve or re-route</text><path d="M950 172 V220 H795" stroke="#475569" stroke-width="2" fill="none"/><path d="M803 212 L795 220 L803 228" stroke="#475569" stroke-width="2" fill="none"/><rect x="490" y="205" width="300" height="72" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="640" y="234" text-anchor="middle" font-family="Arial" font-size="16" fill="#14532d">Preserve static waypoints</text><text x="640" y="255" text-anchor="middle" font-family="Arial" font-size="13" fill="#14532d">if unchanged and collision-free</text><path d="M950 172 V305 H795" stroke="#b91c1c" stroke-width="2" fill="none"/><path d="M803 297 L795 305 L803 313" stroke="#b91c1c" stroke-width="2" fill="none"/><rect x="490" y="288" width="300" height="52" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="640" y="310" text-anchor="middle" font-family="Arial" font-size="15" fill="#7f1d1d">Fallback to obstacle-avoiding router</text><text x="640" y="328" text-anchor="middle" font-family="Arial" font-size="12" fill="#7f1d1d">endpoint edit / intersecting obstacle / invalid data</text></svg>
