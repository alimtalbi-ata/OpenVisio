<line x1="28" y1="205" x2="1172" y2="205" stroke="#cbd5e1"/>
<text x="28" y="236" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#0f172a" font-weight="700">Geometry contract</text>
<g font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#334155">
 <text x="28" y="264">• Visual outline is projected inside the node's existing bounding box.</text>
 <text x="28" y="290">• Connector anchors, hit testing and routing still use model dimensions — no silent geometry changes.</text>
 <text x="28" y="316">• Unknown, grouped and small legacy shapes keep the original rectangle fallback.</text>
 <text x="28" y="346" font-size="12">Illustrative OpenVisio vectors only; not Microsoft Visio Desktop or vendor-stencil certification. Author: Abdelhalim Talbi.</text>
</g>
