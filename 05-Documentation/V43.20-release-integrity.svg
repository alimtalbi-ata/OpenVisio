<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="310" viewBox="0 0 1080 310" role="img" aria-labelledby="title desc">
<title id="title">OpenVisio source reconciliation and release gate</title><desc id="desc">The verified GitHub engine passes mirror and dependency checks, Windows qualification, and then receives a reproducible cumulative manifest.</desc>
<rect x="20" y="26" width="250" height="90" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="145" y="54" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#1e3a8a">GitHub checkout</text><text x="145" y="78" text-anchor="middle" font-family="Arial" font-size="13" fill="#1e3a8a">model / vsdx / render</text><text x="145" y="97" text-anchor="middle" font-family="Arial" font-size="13" fill="#1e3a8a">both source mirrors</text>
<path d="M270 70 H318" stroke="#334155" stroke-width="3"/><path d="M309 62 L319 70 L309 78" fill="none" stroke="#334155" stroke-width="3"/>
<rect x="320" y="26" width="245" height="90" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="442" y="54" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#14532d">Integrity gate</text><text x="442" y="78" text-anchor="middle" font-family="Arial" font-size="13" fill="#14532d">dependencies + tests</text><text x="442" y="97" text-anchor="middle" font-family="Arial" font-size="13" fill="#14532d">version + SHA-256</text>
<path d="M565 70 H613" stroke="#334155" stroke-width="3"/><path d="M604 62 L614 70 L604 78" fill="none" stroke="#334155" stroke-width="3"/>
<rect x="615" y="26" width="205" height="90" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="717" y="54" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#78350f">Windows CI</text><text x="717" y="78" text-anchor="middle" font-family="Arial" font-size="13" fill="#78350f">build + smoke</text><text x="717" y="97" text-anchor="middle" font-family="Arial" font-size="13" fill="#78350f">portable + installer</text>
<path d="M820 70 H868" stroke="#334155" stroke-width="3"/><path d="M859 62 L869 70 L859 78" fill="none" stroke="#334155" stroke-width="3"/>
<rect x="870" y="26" width="190" height="90" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="965" y="54" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#4c1d95">Cumulative ZIP</text><text x="965" y="78" text-anchor="middle" font-family="Arial" font-size="13" fill="#4c1d95">correct version</text><text x="965" y="97" text-anchor="middle" font-family="Arial" font-size="13" fill="#4c1d95">verified hashes</text>
<rect x="32" y="170" width="1016" height="106" rx="10" fill="#fff1f2" stroke="#be123c" stroke-width="2"/><text x="540" y="198" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#9f1239">Reject stale release metadata instead of overwriting the current engine</text><text x="540" y="226" text-anchor="middle" font-family="Arial" font-size="14" fill="#9f1239">Historical ZIP named V43.4 declares V42.8-partial-embedded-candidate</text><text x="540" y="250" text-anchor="middle" font-family="Arial" font-size="14" fill="#9f1239">Missing python mirrors, routing.py, parallel_geometry.py and referenced SHA256SUMS.txt</text>
</svg>