name: OpenVisio V43.21 Windows cumulative candidate
on:
  push:
    branches: ['develop/v43.21-canonical-archive-paths-20261025']
  pull_request:
    branches: ['develop/v43.20-source-reconciliation-20261025']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-native-candidate:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Verify independent checkout and pinned source blobs
        shell: pwsh
        env:
          OPENVISIO_EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./02-Compilation/Verify-GitHub-Checkout-V43.21.ps1
      - name: Archive the exact checked-out source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          git archive --format=zip --output=dist/OpenVisio-V43.21-GitHub-Source-Checkout.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Git source archive failed' }
      - name: Upload exact source checkout
        uses: actions/upload-artifact@v4
        with:
          name: OpenVisio-V43.21-GitHub-Source-Checkout
          path: dist/OpenVisio-V43.21-GitHub-Source-Checkout.zip
          if-no-files-found: error
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
      - name: Build Windows portable, installer, docs and cumulative ZIP
        shell: pwsh
        run: ./02-Compilation/Build-Windows-V43.21-Candidate.ps1
      - name: Independently re-audit final cumulative ZIP and sidecar
        shell: pwsh
        run: |
          $zip = 'dist/OpenVisio-V43.21-Cumulative-Windows-x64.zip'
          $sidecar = "$zip.sha256"
          if (!(Test-Path -LiteralPath $zip) -or !(Test-Path -LiteralPath $sidecar)) { throw 'Cumulative ZIP or SHA-256 sidecar absent' }
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $line = (Get-Content -LiteralPath $sidecar -Raw).Trim()
          if (!$line.StartsWith($actual + '  ')) { throw 'Cumulative ZIP SHA-256 sidecar mismatch' }
          python 02-Compilation/verify_release_archive.py --archive $zip --version V43.21 --json-report dist/V43.21-final-archive-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Independent cumulative ZIP audit failed' }
          Write-Host "PASS cumulative ZIP SHA256=$actual"
      - name: Upload one cumulative Windows release kit
        uses: actions/upload-artifact@v4
        with:
          name: OpenVisio-V43.21-Cumulative-Windows-Release
          path: |
            dist/OpenVisio-V43.21-Cumulative-Windows-x64.zip
            dist/OpenVisio-V43.21-Cumulative-Windows-x64.zip.sha256
            dist/V43.21-cumulative-archive-validation.json
            dist/V43.21-final-archive-audit.json
          if-no-files-found: error
      - name: Upload PDF render QA previews (not application screenshots)
        uses: actions/upload-artifact@v4
        with:
          name: OpenVisio-V43.21-PDF-Document-QA-Previews
          path: |
            dist/release-docs/pdf-page-renders/*.png
            dist/release-docs/document-qa.json
          if-no-files-found: error
