name: OpenVisio V42.53 source and test qualification
on:
  push:
    branches: ['develop/v42.53-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source and test
        env:
          PYTHONPATH: python
        run: |
          python -m unittest discover -s python/tests -q
          python -m compileall -q python/openvisio
