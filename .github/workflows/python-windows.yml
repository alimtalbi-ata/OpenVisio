name: OpenVisio Python Windows v42.4
on:
  workflow_dispatch:
  push:
    branches: [develop/openvisio-python-v42]
    paths:
      - 'python/**'
      - '.github/workflows/python-windows.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
      - name: Build Python portable and installer
        shell: cmd
        working-directory: python
        run: Build-Windows.cmd
      - name: Verify release and source-free portable payload
        shell: pwsh
        working-directory: python
        run: |
          $files = @('binary/OpenVisio-v42.4-Windows-x64-Portable.exe', 'binary/OpenVisio-Setup-v42.4-x64.exe', 'dist/OpenVisio-v42.4-Windows-Cumulative.zip')
          foreach ($file in $files) {
            if (!(Test-Path $file)) { throw "Missing: $file" }
            Get-FileHash $file -Algorithm SHA256 | Format-List
          }
          $isolated = Join-Path $env:RUNNER_TEMP 'OpenVisioPortableOnly'
          New-Item -ItemType Directory -Force $isolated | Out-Null
          Copy-Item 'binary/OpenVisio-v42.4-Windows-x64-Portable.exe' (Join-Path $isolated 'OpenVisio.exe')
          if (Test-Path (Join-Path $isolated 'openvisio')) { throw 'Source leakage' }
      - name: Smoke test portable outside repository
        shell: pwsh
        working-directory: python
        run: ./scripts/Smoke-Portable-Windows.ps1 -Executable 'binary/OpenVisio-v42.4-Windows-x64-Portable.exe'
      - name: Smoke test silent installer and uninstall
        shell: pwsh
        working-directory: python
        run: ./scripts/Smoke-Installer-Windows.ps1 -Installer 'binary/OpenVisio-Setup-v42.4-x64.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: OpenVisio-v42.4-Python-Windows
          path: |
            python/binary/**
            python/dist/OpenVisio-v42.4-Windows-Cumulative.zip
          if-no-files-found: error
          retention-days: 30
