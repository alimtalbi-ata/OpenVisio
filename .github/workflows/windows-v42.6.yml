name: OpenVisio V42.6 Windows qualification
on:
  workflow_dispatch:
  push:
    branches: [develop/v42.6-windows-qualification]
jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify V42.6 source tree
        shell: pwsh
        run: |
          $required = @('03-Sources/openvisio/app.py', '03-Sources/openvisio/document_integrity.py', '03-Sources/run_openvisio.py', '04-Tests/tests', '02-Compilation/Build-Windows.cmd')
          foreach ($item in $required) { if (-not (Test-Path $item)) { throw "Missing V42.6 source tree component: $item" } }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build and test
        shell: cmd
        run: call 02-Compilation\Build-Windows.cmd
      - name: Verify ZIP contents and hashes
        shell: pwsh
        run: |
          $zip = "02-Compilation/dist/OpenVisio-v42.6-Windows-Cumulative.zip"
          if (!(Test-Path $zip)) { throw "Missing Windows ZIP" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            $names = @($archive.Entries | ForEach-Object FullName)
            foreach ($pattern in @("01-Application/binary/*Portable.exe", "01-Application/binary/*Setup*.exe", "05-Documentation/*.pdf", "05-Documentation/*.docx", "03-Sources/openvisio/app.py", "07-Manifestes/manifest.json")) {
              if (-not @($names | Where-Object { $_ -like $pattern }).Count) { throw "Missing archive content: $pattern" }
            }
            foreach ($entry in $archive.Entries) {
              if ($entry.Length -gt 0) {
                $stream = $entry.Open()
                try { $buffer = New-Object byte[] 65536; while ($stream.Read($buffer, 0, $buffer.Length) -gt 0) {} } finally { $stream.Dispose() }
              }
            }
          } finally { $archive.Dispose() }
          Get-FileHash $zip -Algorithm SHA256 | Format-List
      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: OpenVisio-V42.6-Windows-Cumulative
          path: 02-Compilation/dist/OpenVisio-v42.6-Windows-Cumulative.zip
          if-no-files-found: error
          retention-days: 30
