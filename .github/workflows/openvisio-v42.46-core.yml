name: OpenVisio V42.46 core group-drag regression
on:
  push:
    branches:
      - 'develop/v42.46-*'
    paths:
      - 'python/openvisio/layout.py'
      - 'python/tests/test_group_drag_atomic_core_v4246.py'
      - '.github/workflows/openvisio-v42.46-core.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-regression:
    name: Core regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify checkout and source paths
        shell: pwsh
        run: |
          if (!(Test-Path 'python/openvisio/layout.py')) { throw 'Missing real layout engine' }
          if (!(Test-Path 'python/tests/test_group_drag_atomic_core_v4246.py')) { throw 'Missing regression tests' }
      - name: Execute group-drag regressions
        shell: pwsh
        env:
          PYTHONPATH: python
        run: |
          python -m unittest discover -s python/tests -p 'test_group_drag_atomic_core_v4246.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Core group-drag regressions failed' }
