name: OpenVisio Windows qualification (fail closed)
on:
  workflow_dispatch:
  push:
    branches:
      - 'develop/**'
    paths:
      - '03-Sources/**'
      - '04-Tests/**'
      - '02-Compilation/**'
      - '.github/workflows/windows-qualification.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Check required modules
        shell: pwsh
        run: |
          $required = @(
            '03-Sources/openvisio/app.py',
            '03-Sources/openvisio/vsdx.py',
            '03-Sources/openvisio/vsdx_external.py',
            '03-Sources/openvisio/palette_placement.py',
            '03-Sources/openvisio/symbols.py',
            '03-Sources/openvisio/export.py',
            '03-Sources/run_openvisio.py',
            '02-Compilation/Build-Windows.cmd'
          )
          $missing = @($required | Where-Object { -not (Test-Path $_) })
          if ($missing.Count -gt 0) { throw "BLOCKED: missing source files: $($missing -join ', ')" }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build portable and installer; run tests
        shell: cmd
        run: call 02-Compilation\\Build-Windows.cmd
      - name: Verify actual Windows outputs
        shell: pwsh
        run: |
          $portable = @(Get-Item '02-Compilation/dist/OpenVisio-v42.7-Windows-x64-Portable.exe' -ErrorAction SilentlyContinue)
          $installer = @(Get-Item '02-Compilation/dist/installer/OpenVisio-Setup-v42.7-x64.exe' -ErrorAction SilentlyContinue)
          if (!$portable.Count -or !$installer.Count) { throw 'BLOCKED: portable or installer not produced' }
          foreach ($f in ($portable + $installer)) {
            if ($f.LastWriteTimeUtc -lt (Get-Date).ToUniversalTime().AddMinutes(-90)) { throw "STALE artifact: $($f.FullName)" }
            Get-FileHash -Algorithm SHA256 $f.FullName
          }
      - name: Smoke test isolated Windows portable executable
        shell: pwsh
        run: |
          & '04-Tests/Smoke-Portable-Windows.ps1' -Executable '02-Compilation/dist/OpenVisio-v42.7-Windows-x64-Portable.exe'
      - name: Publish reproducible binary checksums
        shell: pwsh
        run: |
          $outputs = @(
            '02-Compilation/dist/OpenVisio-v42.7-Windows-x64-Portable.exe',
            '02-Compilation/dist/installer/OpenVisio-Setup-v42.7-x64.exe'
          )
          $outputs | ForEach-Object {
            $f = Get-Item -LiteralPath $_ -ErrorAction Stop
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $f.FullName).Hash.ToLowerInvariant()
            "$hash  $($_ -replace '\\\\','/')" 
          } | Set-Content -Encoding ascii '02-Compilation/dist/SHA256SUMS.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: OpenVisio-Windows-qualified-build
          path: |
            02-Compilation/dist/OpenVisio-v42.7-Windows-x64-Portable.exe
            02-Compilation/dist/installer/OpenVisio-Setup-v42.7-x64.exe
            02-Compilation/dist/SHA256SUMS.txt
          if-no-files-found: error
