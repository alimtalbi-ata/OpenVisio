name: OpenVisio Windows qualification (fail closed)
on:
  workflow_dispatch:
  push:
    branches:
      - 'develop/**'
    paths:
      - '03-Sources/**'
      - '04-Tests/**'
      - '02-Compilation/**'
      - '.github/workflows/windows-qualification.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Check required modules
        shell: pwsh
        run: |
          $required = @(
            '03-Sources/openvisio/app.py',
            '03-Sources/openvisio/vsdx.py',
            '03-Sources/openvisio/vsdx_external.py',
            '03-Sources/openvisio/palette_placement.py',
            '03-Sources/openvisio/symbols.py',
            '03-Sources/openvisio/export.py',
            '03-Sources/run_openvisio.py',
            '02-Compilation/Build-Windows.cmd'
          )
          $missing = @($required | Where-Object { -not (Test-Path $_) })
          if ($missing.Count -gt 0) { throw "BLOCKED: missing source files: $($missing -join ', ')" }
      - name: Compile and import all Python modules before packaging
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path (Get-Location) '03-Sources'
          @'
          import compileall
          import importlib
          from pathlib import Path
          root = Path("03-Sources/openvisio")
          if not compileall.compile_dir(str(root), quiet=1):
              raise SystemExit("FAIL: Python compilation errors")
          for name in ("openvisio.app", "openvisio.vsdx", "openvisio.vsdx_external", "openvisio.export", "openvisio.symbols"):
              importlib.import_module(name)
              print("PASS import:", name)
          '@ | python -
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build portable and installer; run tests
        shell: cmd
        run: call 02-Compilation\\Build-Windows.cmd
      - name: Verify actual Windows outputs
        shell: pwsh
        run: |
          $portable = @(Get-Item '02-Compilation/dist/OpenVisio-v42.7-Windows-x64-Portable.exe' -ErrorAction SilentlyContinue)
          $installer = @(Get-Item '02-Compilation/dist/installer/OpenVisio-Setup-v42.7-x64.exe' -ErrorAction SilentlyContinue)
          if (!$portable.Count -or !$installer.Count) { throw 'BLOCKED: portable or installer not produced' }
          foreach ($f in ($portable + $installer)) {
            if ($f.LastWriteTimeUtc -lt (Get-Date).ToUniversalTime().AddMinutes(-90)) { throw "STALE artifact: $($f.FullName)" }
            Get-FileHash -Algorithm SHA256 $f.FullName
          }
      - name: Verify cumulative Windows ZIP and version-current documentation
        shell: pwsh
        run: |
          $release = '02-Compilation/dist/OpenVisio-v42.7-Windows-Cumulative.zip'
          $docs = @(
            '02-Compilation/dist/documentation/OpenVisio-v42.7-Guide-Windows.docx',
            '02-Compilation/dist/documentation/OpenVisio-v42.7-Guide-Windows.pdf'
          )
          foreach ($item in @($release) + $docs) {
            if (-not (Test-Path -LiteralPath $item -PathType Leaf)) { throw "Missing release output: $item" }
            if ((Get-Item -LiteralPath $item).Length -lt 1000) { throw "Empty release output: $item" }
          }
          @'
          import zipfile
          path = "02-Compilation/dist/OpenVisio-v42.7-Windows-Cumulative.zip"
          with zipfile.ZipFile(path) as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise SystemExit("ZIP CRC failure: " + bad)
              names = set(archive.namelist())
              required = {
                  "01-Application/binary/OpenVisio-v42.7-Windows-x64-Portable.exe",
                  "01-Application/binary/OpenVisio-Setup-v42.7-x64.exe",
                  "07-Manifestes/manifest.json",
                  "07-Manifestes/SHA256SUMS.txt",
              }
              missing = required - names
              if missing:
                  raise SystemExit("Incomplete cumulative ZIP: " + str(sorted(missing)))
          print("PASS: cumulative ZIP integrity and required Windows outputs")
          '@ | python -
      - name: Smoke test isolated Windows portable executable
        shell: pwsh
        run: |
          & '04-Tests/Smoke-Portable-Windows.ps1' -Executable '02-Compilation/dist/OpenVisio-v42.7-Windows-x64-Portable.exe'
      - name: Publish reproducible binary checksums
        shell: pwsh
        run: |
          $outputs = @(
            '02-Compilation/dist/OpenVisio-v42.7-Windows-x64-Portable.exe',
            '02-Compilation/dist/installer/OpenVisio-Setup-v42.7-x64.exe'
          )
          $outputs | ForEach-Object {
            $f = Get-Item -LiteralPath $_ -ErrorAction Stop
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $f.FullName).Hash.ToLowerInvariant()
            "$hash  $($_ -replace '\\\\','/')" 
          } | Set-Content -Encoding ascii '02-Compilation/dist/SHA256SUMS.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: OpenVisio-Windows-qualified-build
          path: |
            02-Compilation/dist/OpenVisio-v42.7-Windows-x64-Portable.exe
            02-Compilation/dist/installer/OpenVisio-Setup-v42.7-x64.exe
            02-Compilation/dist/SHA256SUMS.txt
            02-Compilation/dist/OpenVisio-v42.7-Windows-Cumulative.zip
          if-no-files-found: error
